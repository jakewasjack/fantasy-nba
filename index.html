<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fantasy NBA</title>
<style>
:root{
  --bg:#0f1115; --surface:#181b22; --surface2:#20242d; --line:#2b303b;
  --text:#eef0f4; --muted:#9aa2b1; --accent:#f28c28; --accent-ink:#1a1206;
  --ok:#3fb37f; --bad:#e5534b; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:0 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
h1{font-size:22px;margin:20px 0 4px} h2{font-size:17px;margin:20px 0 8px} h3{font-size:15px;margin:14px 0 6px}
p{margin:6px 0} .muted{color:var(--muted)} .small{font-size:13px}
a{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:4px 0 10px}
button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.sm{padding:6px 10px;font-size:13px}
button.tg{background:var(--surface2);color:var(--text);border:1px solid var(--line);padding:8px 0;min-width:38px;font-size:13px}
button.tg.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.lnk{background:none;color:var(--text);padding:0;border-radius:0;text-align:left;display:block;max-width:100%;font-size:15px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
button:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:12px -16px 0;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.tabs button{background:none;color:var(--muted);border-radius:0;border-bottom:2px solid transparent;padding:12px 10px;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.pill.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-variant-numeric:tabular-nums;font-weight:700;min-width:38px;text-align:right}
.clock{background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:12px 14px;margin:12px 0;font-weight:600}
.clock.wait{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.clock.mini{padding:9px 14px;font-weight:500}
.clock.mini .cdl{font-size:18px;font-variant-numeric:tabular-nums}
details.rival summary::-webkit-details-marker{display:none}
.inj{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-left:6px;flex:none}
.form{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:4px}
.fc{min-width:24px;height:20px;padding:0 4px;border-radius:5px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.fc.up{background:var(--ok);border-color:var(--ok);color:#0b1f15}
.fc.down{background:var(--bad);border-color:var(--bad);color:#fff}
.fc.dnp{background:transparent;color:var(--muted);border-style:dashed}
.rsum{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}
.rsum>*{flex:none}.rsum .rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.rival[open] .chev{transform:rotate(180deg)}
details.rival .chev{display:inline-block;transition:transform .15s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.msg{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:688px;margin:0 auto;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);z-index:20}
.msg.err{border-color:var(--bad)}
.board{display:grid;gap:8px}
.board .col h3{margin:0 0 6px}
.hidden{display:none}
/* Posiciones: G exterior (azul), F alero (verde agua), C pívot (violeta). Los duales se parten en dos. */
:root{--pG:#4ea8ff;--pF:#2fbf9b;--pC:#a77bff}
.pos{display:inline-flex;flex-shrink:0;border-radius:7px;overflow:hidden;height:28px;font:700 12px/28px ui-monospace,Menlo,monospace;color:#0f1115;letter-spacing:.02em}
.pos i{font-style:normal;width:34px;text-align:center}
.pos.dual i{width:17px}
.pos .G{background:var(--pG)} .pos .F{background:var(--pF)} .pos .C{background:var(--pC)}
.pos .X{background:var(--surface2);color:var(--muted);border:1px dashed var(--line);border-radius:7px}
.pos.sm{height:20px;line-height:20px;font-size:11px;border-radius:5px;vertical-align:-4px}
.pos.sm i{width:22px} .pos.sm.dual i{width:13px}
.court{display:flex;gap:6px;margin:4px 0 8px}
.court .slot{flex:1;height:8px;border-radius:4px;background:var(--surface2);display:flex;overflow:hidden}
.court .slot span{flex:1}
.reqs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.req{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.req.ok{color:var(--text);border-color:var(--ok)} .req.ko{color:var(--bad);border-color:var(--bad)}
.req b{display:inline-block;width:9px;height:9px;border-radius:50%}
/* Reacciones */
.rx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rx button{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:13px;font-weight:500;line-height:1.3}
.rx button.on{border-color:var(--accent);background:rgba(242,140,40,.15)}
.rx button.add{color:var(--muted)}
.rx.pick{display:grid;grid-template-columns:repeat(5,44px);gap:6px}
.rx.pick button{padding:5px 0;font-size:18px;text-align:center}
.imp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.imp .who{display:inline-flex;align-items:center;gap:5px;background:#2a1414;border:1px solid #6b2a26;color:#ffb4ac;border-radius:99px;padding:2px 9px 2px 2px;font-size:12px;font-weight:700;letter-spacing:.02em}
.imp button{background:transparent;color:#ffb4ac;border:1px dashed #6b2a26;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.imp button.on{background:#e5534b;color:#fff;border-style:solid;border-color:#e5534b}
.trib{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.trib .name{white-space:normal;overflow-wrap:anywhere}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;color:var(--muted);padding:8px 6px;font-size:14px;border-radius:8px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.trib .cell{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.wall{max-height:380px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(to bottom,#000 85%,transparent);-webkit-mask-image:linear-gradient(to bottom,#000 85%,transparent);padding-bottom:24px}
.bell{position:relative;background:transparent;border:0;width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.bellN{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font:700 11px/18px system-ui,sans-serif;text-align:center}
.ta{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:-6px 0 10px;overflow:hidden}
.ta button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;color:var(--text);border-radius:0;border-bottom:1px solid var(--line);padding:10px 12px;font-weight:400}
.ta button:last-child{border-bottom:0}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:12px;align-items:center;max-width:720px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:2px solid var(--accent)}
code{background:var(--surface2);padding:2px 6px;border-radius:6px;font-size:14px}
</style>
</head>
<body>
<div id="app"><p class="muted" style="margin-top:40px">Cargando…</p></div>
<div id="msg" class="msg hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://chobiypolwisbaeccsxw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-h8fYrI6w6VbDchcxPxXzA_cl6movfG';
const SEASON = '2026-27';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const AWARDS = [
  ['mvp','MVP'],['roy','Rookie del año'],['dpoy','Mejor defensor'],
  ['smoy','Sexto hombre'],['mip','Jugador más mejorado'],['champion','Campeón NBA']
];
const TEAMS = 'ATL BOS BKN CHA CHI CLE DAL DEN DET GSW HOU IND LAC LAL MEM MIA MIL MIN NOP NYK OKC ORL PHI PHX POR SAC SAS TOR UTA WAS'.split(' ');

const S = { user:null, profile:null, leagues:[], league:null, tab:'draft', players:null, members:[], picks:[], state:null, poll:null, q:'', team:'', onlyRookies:false, sort:'valor', affordable:false };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t, err){ const m=$('#msg'); m.textContent=t; m.className='msg'+(err?' err':''); clearTimeout(toast.t); toast.t=setTimeout(()=>m.className='msg hidden', 3500); }
function fail(e){ toast((e && (e.message||e.error_description)) || String(e), true); }

// ---------- Auth ----------
function viewAuth(mode='login'){
  $('#app').innerHTML = `
    <h1>Fantasy NBA</h1>
    <p class="muted">Liga privada · temporada ${SEASON}</p>
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <button class="${mode==='login'?'':'ghost'}" onclick="viewAuth('login')">Entrar</button>
        <button class="${mode==='signup'?'':'ghost'}" onclick="viewAuth('signup')">Crear cuenta</button>
      </div>
      <form id="f">
        ${mode==='signup'?'<label class="small muted">Tu nombre (lo verán los demás)</label><input name="name" required maxlength="30">':''}
        <label class="small muted">Email</label><input name="email" type="email" required autocomplete="email">
        <label class="small muted">Contraseña</label><input name="pass" type="password" required minlength="8" autocomplete="${mode==='login'?'current-password':'new-password'}">
        <button style="width:100%">${mode==='login'?'Entrar':'Crear cuenta'}</button>
      </form>
      ${mode==='login'?'<p class="small" style="text-align:center;margin:12px 0 0"><a href="#" onclick="viewForgot();return false">¿Has olvidado tu contraseña?</a></p>':''}
    </div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try{
      if(mode==='signup'){
        const { data, error } = await sb.auth.signUp({ email:f.get('email'), password:f.get('pass'), options:{ data:{ display_name:f.get('name') } } });
        if(error) throw error;
        if(!data.session){ toast('Cuenta creada. Revisa tu email para confirmarla.'); return; }
        await sb.from('profiles').update({ display_name:f.get('name') }).eq('id', data.user.id);
      } else {
        const { error } = await sb.auth.signInWithPassword({ email:f.get('email'), password:f.get('pass') });
        if(error) throw error;
      }
    }catch(err){ fail(err); }
  };
}
function viewForgot(){
  $('#app').innerHTML = `
    <h1>Fantasy NBA</h1>
    <div class="card">
      <h2 style="margin-top:0">Recuperar contraseña</h2>
      <p class="small muted">Escribe el email con el que entras. Te enviaremos un enlace para poner una contraseña nueva. Si no lo ves en unos minutos, mira en spam.</p>
      <form id="f">
        <label class="small muted">Email</label><input name="email" type="email" required autocomplete="email">
        <button style="width:100%">Enviar enlace</button>
      </form>
      <p class="small" style="text-align:center;margin:12px 0 0"><a href="#" onclick="viewAuth('login');return false">← Volver a entrar</a></p>
    </div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); const email = new FormData(e.target).get('email');
    const btn = e.target.querySelector('button'); btn.disabled = true;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    btn.disabled = false;
    if(error) return fail(error);
    $('#app').querySelector('.card').innerHTML = `<h2 style="margin-top:0">Revisa tu email</h2><p class="muted">Si ${esc(email)} tiene cuenta, te llegará un enlace. Ábrelo en este mismo dispositivo y podrás poner una contraseña nueva.</p><p class="small"><a href="#" onclick="viewAuth('login');return false">← Volver a entrar</a></p>`;
  };
}
function viewNewPass(){
  S.recovering = true; stopPoll();
  $('#app').innerHTML = `
    <h1>Fantasy NBA</h1>
    <div class="card">
      <h2 style="margin-top:0">Nueva contraseña</h2>
      <form id="f">
        <label class="small muted">Contraseña nueva (mínimo 8 caracteres)</label><input name="pass" type="password" required minlength="8" autocomplete="new-password">
        <button style="width:100%">Guardar y entrar</button>
      </form>
    </div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: new FormData(e.target).get('pass') });
    if(error) return fail(error);
    S.recovering = false; history.replaceState(null, '', location.pathname);
    toast('Contraseña cambiada'); loadHome();
  };
}

// ---------- Home ----------
async function loadHome(){
  const { data:prof } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  S.profile = prof;
  const { data:mem, error } = await sb.from('league_members').select('team_name, leagues(*)').eq('user_id', S.user.id);
  if(error) return fail(error);
  S.leagues = (mem||[]).map(m => ({ ...m.leagues, my_team:m.team_name }));
  const saved = localGet('league');
  const l = S.leagues.find(x => x.id === saved) || (S.leagues.length === 1 ? S.leagues[0] : null);
  if(l) return openLeague(l.id);
  viewHome();
}
function viewHome(){
  stopPoll();
  $('#app').innerHTML = `
    <div class="between"><h1>Hola, ${esc(S.profile?.display_name || '')}</h1><button class="ghost sm" onclick="logout()">Salir</button></div>
    ${S.leagues.length ? `<h2>Tus ligas</h2>${S.leagues.map(l=>`
      <div class="card between"><div><div class="name">${esc(l.name)}</div><div class="small muted">${esc(l.my_team)}</div></div>
      <button class="sm" onclick="openLeague('${l.id}')">Entrar</button></div>`).join('')}` : ''}
    <h2>Unirme con código</h2>
    <form id="fj" class="card">
      <label class="small muted">Código de invitación</label><input name="code" required>
      <label class="small muted">Nombre de tu equipo</label><input name="team" required maxlength="30">
      <button style="width:100%">Unirme</button>
    </form>
    <h2>Crear liga</h2>
    <form id="fc" class="card">
      <label class="small muted">Nombre de la liga</label><input name="name" required maxlength="40">
      <label class="small muted">Nombre de tu equipo</label><input name="team" required maxlength="30">
      <button style="width:100%">Crear y ser comisionado</button>
    </form>`;
  $('#fj').onsubmit = async e => { e.preventDefault(); const f=new FormData(e.target);
    const { data, error } = await sb.rpc('join_league', { p_code:f.get('code'), p_team_name:f.get('team') });
    if(error) return fail(error); toast('Dentro de la liga'); openLeague(data); };
  $('#fc').onsubmit = async e => { e.preventDefault(); const f=new FormData(e.target);
    const { data, error } = await sb.rpc('create_league', { p_name:f.get('name'), p_team_name:f.get('team') });
    if(error) return fail(error); toast('Liga creada'); openLeague(data); };
}
async function logout(){ localSet('league',''); await sb.auth.signOut(); }

// ---------- League ----------
async function openLeague(id){
  localSet('league', id);
  const { data:l, error } = await sb.from('leagues').select('*').eq('id', id).single();
  if(error) return fail(error);
  S.league = l; S.lu = null; S.td = null; S.room = null; S.mk = null; S.view = null; S.d5w = null;
  sb.rpc('settle_due').then(()=>{}, ()=>{});
  if(!S.players) await loadPlayers();
  await refreshLeague();
  S.tab = l.draft_status === 'cerrado' ? 'hoy' : 'draft';
  render(); startPoll(); loadNotis();
}
async function loadPlayers(){
  const all = []; let from = 0;
  while(true){
    const { data, error } = await sb.from('players').select('id,name,team,position,is_rookie,draft_pick,player_prices(price_m,pts_per_game)').eq('active', true).eq('player_prices.season', SEASON).range(from, from+999);
    if(error) { fail(error); break; }
    all.push(...data); if(data.length < 1000) break; from += 1000;
  }
  S.players = all.map(p => ({ id:p.id, name:p.name, team:p.team, pos:p.position, rookie:p.is_rookie, pick:p.draft_pick,
    price:p.player_prices?.[0]?.price_m ?? 1, fp:p.player_prices?.[0]?.pts_per_game }))
    .sort((a,b)=> b.price-a.price || (b.fp??0)-(a.fp??0) || a.name.localeCompare(b.name));
  S.players.filter(p=>p.fp!=null).sort((a,b)=>b.fp-a.fp).forEach((p,i)=>p.rank=i+1);
  S.byId = Object.fromEntries(S.players.map(p=>[p.id,p]));
}
async function refreshLeague(){
  const id = S.league.id;
  const [m, pk, st, lg] = await Promise.all([
    sb.from('league_members').select('user_id,team_name,draft_position,profiles(display_name,avatar_url)').eq('league_id', id),
    sb.from('draft_picks').select('*').eq('league_id', id).order('pick_no'),
    sb.rpc('draft_state', { p_league:id }),
    sb.from('leagues').select('*').eq('id', id).single()
  ]);
  if(m.error) return fail(m.error);
  S.members = m.data.map(x=>({ id:x.user_id, team:x.team_name, pos:x.draft_position, name:x.profiles?.display_name || '—', avatar:x.profiles?.avatar_url || '' }))
    .sort((a,b)=>(a.pos??99)-(b.pos??99));
  S.picks = pk.data || []; S.state = st.data; if(lg.data) S.league = lg.data;
  if(S.league.draft_status !== 'pendiente') await loadRx();
}
// Draft en directo: consulta cada 3 s; al volver a la pestaña, al momento. Si estás escribiendo, espera a que sueltes el campo.
async function pollOnce(){
  if(document.hidden || !S.league || S.league.draft_status === 'cerrado' || S.pollBusy) return;
  S.pollBusy = true;
  try{
    const sig = () => S.picks.length + S.league.draft_status + S.members.map(m=>m.pos).join(',') + S.members.length + (S.rxSig || '');
    const before = sig(), wasMine = S.state?.on_clock === S.user.id, nBefore = S.picks.length;
    await refreshLeague();
    let ann = '';
    if(S.picks.length > nBefore){ const pk = S.picks[S.picks.length-1];
      ann = `📣 ${member(pk.user_id).team} elige a ${S.byId[pk.player_id]?.name || 'un jugador'} (${pk.price_m}M)`; }
    const mine = S.league.draft_status === 'en_curso' && S.state?.on_clock === S.user.id;
    document.title = mine ? '🏀 ¡Te toca! · Fantasy NBA' : 'Fantasy NBA';
    if(mine && !wasMine){ try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} toast((ann ? ann + ' · ' : '') + '¡Te toca elegir!'); }
    else if(ann) toast(ann);
    if(before !== sig()){ if(isTyping()) S.pendingRender = true; else if(!S.view) render(); }
  } finally { S.pollBusy = false; }
}
function startPoll(){ stopPoll(); S.poll = setInterval(pollOnce, 3000); }
document.addEventListener('visibilitychange', () => { if(!document.hidden && S.poll) pollOnce(); });
document.addEventListener('focusout', () => setTimeout(() => { if(S.pendingRender && !isTyping()){ S.pendingRender = false; if(!S.view) render(); } }, 50));
function stopPoll(){ if(S.poll) clearInterval(S.poll); S.poll = null; }
const isTyping = () => document.activeElement && ['INPUT','SELECT'].includes(document.activeElement.tagName);
const member = uid => S.members.find(m=>m.id===uid) || { team:'—', name:'—' };
const isComm = () => S.league.commissioner_id === S.user.id;

function myTeamInfo(uid = S.user.id){
  const mine = S.picks.filter(p=>p.user_id===uid);
  const spent = mine.reduce((a,p)=>a+p.price_m,0);
  const hasRookie = mine.some(p=>S.byId[p.player_id]?.rookie);
  return { mine, spent, left: S.league.budget_m - spent, slots: S.league.roster_size - mine.length, hasRookie };
}

function render(){
  const done = S.league.draft_status === 'cerrado';
  const tabs = done ? [['hoy','Hoy'],['equipo','Plantilla'],['mercado','Mercado'],['pred','Playground'],['liga','Liga']]
                    : [['draft','Draft'],['equipo','Plantilla'],['pred','Playground'],['liga','Liga']];
  if(!tabs.some(([k]) => k === S.tab)) S.tab = tabs[0][0];
  if(S.tab !== 'hoy') stopTick();
  if(S.tab !== 'mercado' || !S.room) stopRoomPoll();
  if(S.view){ stopTick(); stopRoomPoll(); $('#app').innerHTML = '<main id="tab"></main>'; return renderView(); }
  $('#app').innerHTML = `
    <div class="between" style="margin-top:14px">
      <div><div class="small muted">${esc(S.league.name)}</div><div class="name" style="font-size:18px">${esc(member(S.user.id).team)}</div></div>
      <div style="display:flex;gap:10px;align-items:center">
        <button onclick="openView('notis')" aria-label="Notificaciones" class="bell"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="bellN" class="bellN ${S.unread?'':'hidden'}">${S.unread > 9 ? '9+' : (S.unread || '')}</span></button>
        <button onclick="openView('perfil')" aria-label="Perfil y ajustes" style="background:none;padding:0;border-radius:50%">${avatar(S.user.id, 40)}</button>
      </div>
    </div>
    <nav class="tabs">${tabs.map(([k,t])=>`<button class="${S.tab===k?'on':''}" onclick="goTab('${k}')">${t}</button>`).join('')}</nav>
    <main id="tab"></main>`;
  ({ draft:renderDraft, hoy:renderHome, equipo:renderTeam, mercado:renderMarket, pred:renderPred, liga:renderLiga })[S.tab]();
}

// ---------- Draft ----------
function renderDraft(){
  const st = S.state || {}; const status = S.league.draft_status;
  const me = myTeamInfo();
  const taken = new Set(S.picks.map(p=>p.player_id));
  const onClock = st.on_clock; const myTurn = onClock === S.user.id;
  // El comisionado solo elige por otro si lo activa expresamente para ese turno
  const canActFor = !myTurn && isComm() && onClock && status === 'en_curso';
  if(S.actFor && (S.actFor !== onClock || myTurn)) S.actFor = null;
  const actingFor = myTurn ? S.user.id : (canActFor && S.actFor === onClock ? onClock : null);
  const actor = actingFor ? myTeamInfo(actingFor) : null;
  let head = '';
  if(S.wlLeague !== S.league.id){ S.wlLeague = S.league.id; S.wl = []; loadWishlist(); }
  if(status === 'pendiente') head = `<div class="clock wait">El draft aún no ha empezado. ${isComm()?'Sortea o fija el orden y arráncalo cuando estéis todos.':'El comisionado lo abrirá.'} Mientras, haz tu scouting: marca con ☆ a los jugadores que te interesan y ordena tu lista.</div>` + orderCard();
  else if(status === 'cerrado') head = `<div class="clock wait">Draft terminado. ¡A por la temporada!</div>`;
  else head = `<div class="clock ${myTurn?'':'wait'}">${myTurn ? '¡Te toca!' : 'Elige ' + esc(member(onClock).team)} · pick ${st.next_pick+1} de ${st.total_picks} · ronda ${Math.floor(st.next_pick/S.members.length)+1}</div>`;

  const q = S.q.toLowerCase();
  // De quién son los números que se ven: de quien elige ahora (si elijo por otro) o míos
  const who = actor || me; const whoName = actingFor && !myTurn ? member(actingFor).team : null;
  // Máximo que se puede pagar por un jugador ahora, reservando 1M por cada hueco restante
  const maxPrice = who.slots > 0 ? who.left - (who.slots - 1) : 0;
  const sorters = {
    valor: (a,b)=> b.price-a.price || (b.fp??-1)-(a.fp??-1),
    media: (a,b)=> (b.fp??-1)-(a.fp??-1) || b.price-a.price,
    barato: (a,b)=> a.price-b.price || (b.fp??-1)-(a.fp??-1)
  };
  const inWl = new Set(S.wl);
  let all = S.players.filter(p => !taken.has(p.id) && (!S.onlyList || inWl.has(p.id)) && (!q || p.name.toLowerCase().includes(q)) && (!S.team || p.team===S.team) && (!S.pos || (p.pos||'G-F').includes(S.pos)) && (!S.onlyRookies || p.rookie) && (!S.affordable || p.price <= maxPrice)).sort(sorters[S.sort] || sorters.valor);
  if(S.onlyList) all = S.wl.map(id => all.find(p => p.id === id)).filter(Boolean);
  const avail = all.slice(0, 100);
  const canPick = p => {
    if(!actor || status!=='en_curso') return false;
    const leftAfter = actor.slots - 1;
    if(actor.spent + p.price + leftAfter > S.league.budget_m) return false;
    if(leftAfter === 0 && !actor.hasRookie && !p.rookie) return false;
    return true;
  };
  $('#tab').innerHTML = `
    ${head}
    ${lastPickCard()}
    ${whoName ? `<p class="small" style="margin:10px 0 0"><b>Modo comisionado: eliges por ${esc(whoName)}</b> <span class="muted">· estos son sus números, no los tuyos</span> <a href="#" onclick="S.actFor=null;S.armed=null;renderDraft();return false">Salir</a></p>`
      : canActFor ? `<p class="small muted" style="margin:10px 0 0">No es tu turno. Como comisionado puedes <a href="#" onclick="S.actFor='${onClock}';renderDraft();return false">elegir por ${esc(member(onClock).team)}</a> si te lo pide.</p>` : ''}
    <div class="stats">
      <div class="stat"><b>${who.left}M</b><span>${whoName?'su presupuesto':'presupuesto'}</span></div>
      <div class="stat"><b>${who.slots}</b><span>huecos</span></div>
      <div class="stat"><b>${who.hasRookie?'✓':'—'}</b><span>rookie</span></div>
    </div>
    <p class="small muted" style="margin:0 0 10px">${S.members.map(m=>{const t=myTeamInfo(m.id);return `${esc(m.team)} <b style="color:var(--text)">${t.left}M</b>`}).join(' · ')}</p>
    ${wishlistCard(taken)}
    <div class="row">
      <input id="q" placeholder="Buscar jugador" value="${esc(S.q)}">
      <select id="team" style="max-width:110px"><option value="">Equipo</option>${TEAMS.map(t=>`<option ${S.team===t?'selected':''}>${t}</option>`).join('')}</select>
    </div>
    <div class="row">
      <select id="dpos" aria-label="Posición" style="max-width:130px"><option value="">Posición</option><option value="G" ${S.pos==='G'?'selected':''}>Exterior (G)</option><option value="F" ${S.pos==='F'?'selected':''}>Alero (F)</option><option value="C" ${S.pos==='C'?'selected':''}>Pívot (C)</option></select>
      <select id="sort" aria-label="Ordenar"><option value="valor" ${S.sort==='valor'?'selected':''}>Orden: valor (caros primero)</option><option value="media" ${S.sort==='media'?'selected':''}>Orden: FPPG (media fantasy)</option><option value="barato" ${S.sort==='barato'?'selected':''}>Orden: baratos primero</option></select>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px">
      <label class="small muted"><input type="checkbox" id="af" ${S.affordable?'checked':''} style="width:auto;margin:0 6px 0 0">Solo los que ${whoName?'puede':'puedo'} pagar (≤ ${Math.max(maxPrice,0)}M)</label>
      <label class="small muted"><input type="checkbox" id="rk" ${S.onlyRookies?'checked':''} style="width:auto;margin:0 6px 0 0">Solo rookies</label>
      <label class="small muted"><input type="checkbox" id="ol" ${S.onlyList?'checked':''} style="width:auto;margin:0 6px 0 0">Solo mi lista (${S.wl.filter(id=>!taken.has(id)).length})</label>
    </div>
    <p class="small muted" style="margin:0 0 4px">${all.length} jugadores${all.length>100?' · se muestran 100, afina con los filtros':''}</p>
    <ul class="list card" style="padding:0 14px">
      ${avail.map(p=>`<li>
        <button class="tg ${inWl.has(p.id)?'on':''}" onclick="wlToggle(${p.id})" aria-label="${inWl.has(p.id)?'Quitar de mi lista':'Añadir a mi lista'}" style="min-width:34px">${inWl.has(p.id)?'★':'☆'}</button>
        <span class="price">${p.price}M</span>
        <div class="grow"><div class="name">${esc(p.name)}</div>
          <div class="small muted">${posBadge(p.pos,1)} ${p.team}${p.rookie?' · <span class="pill ok">rookie'+(p.pick?' #'+p.pick:'')+'</span>':''}${p.fp?' · '+Number(p.fp).toFixed(1)+' FPPG'+(p.rank?' <span class="muted">(#'+p.rank+')</span>':''):''}</div></div>
        ${status==='en_curso'?`<button class="sm" ${canPick(p)?'':'disabled'} onclick="pick(${p.id})">${S.armed===p.id?'Confirmar':'Elegir'}</button>`:''}
      </li>`).join('') || '<li class="muted">Nadie con ese filtro</li>'}
    </ul>
    <h2 id="picks">Picks por rondas</h2>
    ${roundsBoard()}`;
  $('#q').oninput = e => { S.q = e.target.value; const pos = e.target.selectionStart; renderDraft(); const i=$('#q'); i.focus(); i.setSelectionRange(pos,pos); };
  $('#team').onchange = e => { S.team = e.target.value; renderDraft(); };
  $('#rk').onchange = e => { S.onlyRookies = e.target.checked; renderDraft(); };
  $('#ol').onchange = e => { S.onlyList = e.target.checked; renderDraft(); };
  $('#dpos').onchange = e => { S.pos = e.target.value; renderDraft(); };
  $('#af').onchange = e => { S.affordable = e.target.checked; renderDraft(); };
  $('#sort').onchange = e => { S.sort = e.target.value; renderDraft(); };
}
// ---------- Mi lista (scouting previo, privada) ----------
async function loadWishlist(){
  const { data } = await sb.from('draft_lists').select('player_ids').eq('league_id', S.league.id).eq('user_id', S.user.id).maybeSingle();
  S.wl = (data?.player_ids || []).map(Number); if(S.tab === 'draft' && !S.view) renderDraft();
}
function wlSave(){ clearTimeout(S.wlT); S.wlT = setTimeout(async () => {
  const { error } = await sb.from('draft_lists').upsert({ league_id:S.league.id, user_id:S.user.id, player_ids:S.wl, updated_at:new Date().toISOString() });
  if(error) fail(error); }, 400); }
function wlToggle(id){ S.wl = S.wl.includes(id) ? S.wl.filter(x=>x!==id) : S.wl.concat(id); wlSave(); renderDraft(); }
function wlMove(id, d){ const i = S.wl.indexOf(id), j = i + d; if(j < 0 || j >= S.wl.length) return; [S.wl[i], S.wl[j]] = [S.wl[j], S.wl[i]]; wlSave(); renderDraft(); }
function wishlistCard(taken){
  if(!S.wl.length) return `<p class="small muted" style="margin:10px 0">Tu lista está vacía. Marca con ☆ a los jugadores que quieres; solo la ves tú.</p>`;
  const by = {}; S.picks.forEach(p => by[p.player_id] = p.user_id);
  const left = S.wl.filter(id => !taken.has(id)).length;
  return `<details class="card" ${S.wlOpen?'open':''} ontoggle="S.wlOpen=this.open" style="padding:10px 14px">
    <summary class="name" style="cursor:pointer">Mi lista · ${left} disponible${left===1?'':'s'} de ${S.wl.length} <span class="small muted">(solo la ves tú)</span></summary>
    <ul class="list" style="margin-top:6px">${S.wl.map((id,i)=>{ const p = S.byId[id] || {}, gone = taken.has(id); return `<li style="padding:6px 0">
      <span class="small muted" style="min-width:20px">${i+1}</span>${posBadge(p.pos,1)}
      <div class="grow" style="${gone?'opacity:.45;text-decoration:line-through':''}"><div class="name" style="font-size:14px">${esc(p.name||'')}</div><div class="small muted">${p.team||''} · ${p.price}M${gone?' · se lo llevó '+esc(member(by[id]).team):''}</div></div>
      <button class="tg" onclick="wlMove(${id},-1)" ${i===0?'disabled':''} aria-label="Subir">▲</button>
      <button class="tg" onclick="wlMove(${id},1)" ${i===S.wl.length-1?'disabled':''} aria-label="Bajar">▼</button>
      <button class="tg" onclick="wlToggle(${id})" aria-label="Quitar">✕</button></li>`; }).join('')}</ul></details>`;
}
// Anuncio público del último pick (lo ven todos, se actualiza solo)
function lastPickCard(){
  if(!S.picks.length) return '';
  const pk = S.picks[S.picks.length-1], pl = S.byId[pk.player_id] || {};
  return `<div class="card" style="margin:10px 0;border-color:var(--accent)">
    <div class="between"><span class="small muted">Pick ${pk.pick_no+1} · ronda ${Math.floor(pk.pick_no/S.members.length)+1}</span><a href="#picks" class="small" onclick="document.getElementById('picks').scrollIntoView({behavior:'smooth'});return false">Ver todas las rondas ↓</a></div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:4px">${posBadge(pl.pos)}<div style="flex:1;min-width:0"><b>${esc(member(pk.user_id).team)}</b> elige a <b>${esc(pl.name||'')}</b><div class="small muted">${pl.team||''} · ${pk.price_m}M${pl.fp!=null?' · '+Number(pl.fp).toFixed(1)+' FPPG':''}${pl.rookie?' · rookie':''}</div>${rxBar('pick', pk.pick_no)}</div></div></div>`;
}
// Todas las rondas, la más reciente arriba
function roundsBoard(){
  if(!S.picks.length) return '<p class="small muted">Todavía ninguno.</p>';
  const n = S.members.length || 1, rounds = {};
  S.picks.forEach(pk => (rounds[Math.floor(pk.pick_no/n)+1] = rounds[Math.floor(pk.pick_no/n)+1] || []).push(pk));
  return Object.keys(rounds).map(Number).sort((a,b)=>b-a).map(r => `<div class="card" style="padding:6px 14px"><div class="small muted" style="margin:4px 0">Ronda ${r}</div><ul class="list">${rounds[r].map(pk => { const pl = S.byId[pk.player_id] || {}; return `<li style="padding:6px 0"><span class="small muted" style="min-width:22px">${pk.pick_no+1}</span>${posBadge(pl.pos,1)}<div class="grow"><div class="name" style="font-size:14px">${esc(pl.name||'')}</div><div class="small muted">${esc(member(pk.user_id).team)} · ${pk.price_m}M</div>${rxBar('pick', pk.pick_no)}</div></li>`; }).join('')}</ul></div>`).join('');
}
async function pick(pid){
  const p = S.byId[pid];
  if(S.armed !== pid){ S.armed = pid; renderDraft(); toast(`Pulsa "Confirmar" para fichar a ${p.name} por ${p.price}M`); return; }
  S.armed = null;
  const { error } = await sb.rpc('make_pick', { p_league:S.league.id, p_player:pid });
  if(error) { renderDraft(); return fail(error); }
  toast(p.name + ' fichado'); await refreshLeague(); render();
}

// ---------- Datos de equipo y mercado (compartidos) ----------
const LIVE = ['pending','negotiating'];
const posOf = id => S.byId[id]?.pos || null;
function posOk(ids){
  const ps = ids.map(id => posOf(id) || 'G-F');
  if(ps.filter(p => p === 'C').length > 2) return false;
  for(let i=0;i<ps.length;i++) for(let j=0;j<ps.length;j++) if(i!==j && ps[i].includes('G') && ps[j].includes('F')) return true;
  return false;
}
const POS_NAME = { G:'Exterior', F:'Alero', C:'Pívot' };
function posBadge(pos, sm){
  const parts = pos ? pos.split('-') : null;
  const title = parts ? parts.map(x=>POS_NAME[x]).join(' / ') : 'Sin posición: cuenta como G o F';
  return `<span class="pos ${sm?'sm':''} ${parts&&parts.length>1?'dual':''}" title="${title}" aria-label="${title}">${parts ? parts.map(x=>`<i class="${x}">${x}</i>`).join('') : '<i class="X">?</i>'}</span>`;
}
const posRank = id => { const p = posOf(id) || 'G-F'; return p.startsWith('G') ? (p.includes('F') ? 1 : 0) : p.startsWith('F') ? (p.includes('C') ? 3 : p.includes('G') ? 2 : 2.5) : p.includes('F') ? 3.5 : 4; };
// Qué cumple el quinteto: G y F cubiertos por jugadores distintos, máximo 2 C puros
function posReqs(ids){
  const ps = ids.map(id => posOf(id) || 'G-F');
  const hasG = ps.some(p => p.includes('G')), hasF = ps.some(p => p.includes('F'));
  const pureC = ps.filter(p => p === 'C').length;
  return { hasG, hasF, pureC };
}
function courtStrip(ids){
  const seg = id => (posOf(id) || 'G-F').split('-').map(x=>`<span style="background:var(--p${x})"></span>`).join('');
  const sorted = ids.slice().sort((a,b)=>posRank(a)-posRank(b));
  const R = posReqs(ids);
  const chip = (ok, color, txt) => `<span class="req ${ok?'ok':'ko'}"><b style="background:${color}"></b>${txt} ${ok?'✓':'✗'}</span>`;
  return `<div class="court" aria-hidden="true">${[0,1,2,3,4].map(i=>`<div class="slot">${sorted[i]!=null?seg(sorted[i]):''}</div>`).join('')}</div>
    <div class="reqs">${chip(R.hasG,'var(--pG)','Mín. 1 exterior')}${chip(R.hasF,'var(--pF)','Mín. 1 alero')}${chip(R.pureC<=2,'var(--pC)',`Pívots puros ${R.pureC}/2`)}</div>`;
}
function bestLineup(ids){
  const fp = id => S.byId[id]?.fp ?? -1;
  const by = ids.slice().sort((x,y)=>fp(y)-fp(x));
  let best = null, bestSum = -1e9;
  const n = by.length;
  for(let a=0;a<n;a++) for(let b=a+1;b<n;b++) for(let c=b+1;c<n;c++) for(let d=c+1;d<n;d++) for(let e=d+1;e<n;e++){
    const five = [by[a],by[b],by[c],by[d],by[e]];
    if(!posOk(five)) continue;
    const s = five.reduce((t,id)=>t+fp(id),0);
    if(s > bestSum){ bestSum = s; best = five; }
  }
  const starters = best || by.slice(0,5);
  return { starters, bench: by.filter(id=>!starters.includes(id)) };
}
async function loadTD(force){
  if(S.td && S.td.league === S.league.id && !force) return S.td;
  const lid = S.league.id, me = S.user.id;
  const w = await sb.rpc('open_week', { p_season: SEASON });
  const week = w.data && w.data.week_no ? w.data : null;
  const none = Promise.resolve({ data: [] });
  const intel = loadIntel();
  const [ro, rq, rs, lm, lu, wg, pv, plu, tr] = await Promise.all([
    sb.from('rosters').select('player_id,user_id,price_paid_m').eq('league_id', lid),
    week ? sb.from('transfer_requests').select('*').eq('league_id', lid).eq('week_no', week.week_no).order('created_at') : none,
    week ? sb.from('player_reservations').select('*').eq('league_id', lid).eq('week_no', week.week_no) : none,
    sb.from('league_members').select('user_id,sanctions_m,adj_m').eq('league_id', lid),
    week ? sb.from('lineups').select('*').eq('league_id', lid).eq('user_id', me).eq('week_no', week.week_no).maybeSingle() : Promise.resolve({ data: null }),
    week ? sb.rpc('week_games', { p_season: SEASON, p_week: week.week_no }) : none,
    sb.from('preference_vouchers').select('*').eq('league_id', lid),
    week ? sb.from('lineups').select('*').eq('league_id', lid).eq('user_id', me).lt('week_no', week.week_no).order('week_no', { ascending:false }).limit(1) : Promise.resolve({ data: [] }),
    week ? sb.from('trades').select('*').eq('league_id', lid).eq('week_no', week.week_no).order('created_at') : none
  ]);
  if(ro.error){ fail(ro.error); return null; }
  await intel;
  const games = {}; (wg.data || []).forEach(x => games[x.team] = x);
  const owner = {}; ro.data.forEach(r => owner[r.player_id] = r.user_id);
  const paid = {}; ro.data.filter(r => r.user_id === me).forEach(r => paid[r.player_id] = r.price_paid_m);
  const reqs = rq.data || [], live = reqs.filter(t => LIVE.includes(t.status)), mineLive = live.filter(t => t.user_id === me);
  const outs = new Set(mineLive.map(t => t.player_out)), ins = mineLive.map(t => t.player_in);
  const roster = Object.keys(paid).map(Number);
  const allPaid = {}; ro.data.forEach(r => allPaid[r.player_id] = r.price_paid_m);
  const trades = tr.data || [], tAcc = trades.filter(x => x.status === 'accepted');
  const myAcc = tAcc.filter(x => x.from_user === me || x.to_user === me);
  const tOut = new Set(myAcc.map(x => x.from_user === me ? x.give_player : x.get_player)), tIn = myAcc.map(x => x.from_user === me ? x.get_player : x.give_player);
  const tradeLock = new Set(tAcc.flatMap(x => [x.give_player, x.get_player]));
  const eff = roster.filter(id => !outs.has(id) && !tOut.has(id)).concat(ins, tIn);
  const price = id => S.byId[id]?.price ?? 1;
  const cost = {}; eff.forEach(id => cost[id] = paid[id] ?? allPaid[id] ?? price(id));
  const mrow = (lm.data || []).find(x => x.user_id === me) || {};
  const sanc = mrow.sanctions_m || 0, adj = mrow.adj_m || 0;
  const bal = S.league.budget_m - roster.reduce((a,id)=>a+paid[id],0) - sanc + adj + mineLive.reduce((a,t)=>a + (paid[t.player_out]||0) - price(t.player_in), 0)
    + [...tOut].reduce((a,id)=>a + (allPaid[id]||0), 0) - tIn.reduce((a,id)=>a + (allPaid[id]||0), 0);
  S.td = { league: lid, week, games, owner, paid, cost, reqs, live, mineLive, outs, ins: new Set(ins), roster, eff, sanc, adj, bal, res: rs.data || [], lineup: lu.data, prevLineup: lu.data ? null : ((plu.data || [])[0] || null), vouchers: pv.data || [], allPaid, trades, tradeLock, tIn: new Set(tIn) };
  return S.td;

    ${rooms.length ? `<h2>Negociaciones abiertas en la liga</h2><ul class="list card" style="padding:0 14px">${rooms.map(([pid,ts])=>`<li>
        <div class="grow"><div class="name">${pname(pid)}</div><div class="small muted">${ts.map(t=>esc(member(t.user_id).team)).join(' vs ')}</div></div>
        <button class="sm ghost" onclick="openRoom(${pid})">Ver la mesa</button></li>`).join('')}</ul>` : ''}
    ${chooser ? `
      <h2>¿Quién sale por ${pname(M.inn)}? <span class="small muted">· cuesta ${price(M.inn)}M</span></h2>

      <ul class="list card" style="padding:0 14px">${canOut.slice().sort((a,b)=>{ const oa = T.bal+(T.paid[a]||0)-price(M.inn)>=0, ob = T.bal+(T.paid[b]||0)-price(M.inn)>=0; return (ob-oa) || (S.byId[a]?.fp??-1)-(S.byId[b]?.fp??-1); }).map(id=>{ const ok = T.bal + (T.paid[id]||0) - price(M.inn) >= 0; return `<li>
        <div class="grow"><div class="name">${pname(id)}${injIcon(id)}</div><div class="small muted">${posBadge(posOf(id),1)} recuperas ${T.paid[id]}M${S.byId[id]?.fp!=null?' · '+Number(S.byId[id].fp).toFixed(1)+' FPPG':''}${ok?'':' · <span style="color:var(--bad)">te faltarían '+(price(M.inn)-T.bal-(T.paid[id]||0))+'M</span>'}</div></div>
        <button class="sm" ${ok?'':'disabled'} onclick="mkConfirm(${id},${M.inn})">${M.armed===id?'Confirmar':'Sale'}</button></li>`}).join('')}</ul>
      <button class="ghost" style="width:100%" onclick="mkReset()">Cancelar</button>` : `
    ${M.out ? `<div class="clock">Buscas sustituto para ${pname(M.out)} · recuperas ${T.paid[M.out]}M · puedes pagar hasta ${maxPrice}M <a href="#" onclick="mkReset();return false" style="color:inherit;margin-left:6px">Cancelar</a></div>` : ''}
    ${tradesMine()}
    <div class="seg" role="tablist" style="margin-top:18px"><button class="${M.mode!=='rivales'?'on':''}" onclick="mkState().mode='libres';drawMarket()">Agentes libres</button><button class="${M.mode==='rivales'?'on':''}" onclick="mkState().mode='rivales';drawMarket()">Otras plantillas</button></div>

    <div class="row">
      <select id="msort" aria-label="Ordenar"><option value="media" ${M.sort==='media'?'selected':''}>Orden: FPPG (media fantasy)</option><option value="partidos" ${M.sort==='partidos'?'selected':''}>Orden: partidos esta jornada</option><option value="valor" ${M.sort==='valor'?'selected':''}>Orden: caros primero</option><option value="barato" ${M.sort==='barato'?'selected':''}>Orden: baratos primero</option></select>
      <select id="mpos" aria-label="Posición" style="max-width:130px"><option value="">Posición</option><option value="G" ${M.pos==='G'?'selected':''}>Exterior (G)</option><option value="F" ${M.pos==='F'?'selected':''}>Alero (F)</option><option value="C" ${M.pos==='C'?'selected':''}>Pívot (C)</option></select>
    </div>

      <label class="small muted"><input type="checkbox" id="maf" ${M.affordable?'checked':''} style="width:auto;margin:0 6px 0 0">Solo los que puedo pagar (≤ ${Math.max(maxPrice,0)}M)</label>

    <p class="small muted" style="margin:0 0 4px">${all.length} libres${all.length>80?' · se muestran 80':''}</p>
    <ul class="list card" style="padding:0 14px">
      ${list.map(p=>{ const others = (reqBy[p.id]||[]).filter(t=>t.user_id!==me); const rsv = resBy[p.id]; const blocked = rsv && rsv !== me; const g = T.games[p.team];
        return `<li>
        <span class="price">${p.price}M</span>
        <div class="grow"><div class="name">${esc(p.name)}${injIcon(p.id)}</div>
          <div class="small muted">${posBadge(p.pos,1)} ${p.team}${p.fp!=null?' · '+Number(p.fp).toFixed(1)+' FPPG':''}${p.rookie?' · <span class="pill ok">rookie</span>':''} · ${g?g.n+' part.':'sin partidos'}</div>
          ${injLine(p.id)}${formLine(p.id)}
          ${others.length ? `<div class="small" style="color:var(--accent)">En disputa entre ${others.map(t=>esc(member(t.user_id).team)).join(' y ')} · <a href="#" onclick="openRoom(${p.id});return false" style="color:inherit">ver la mesa</a></div>` : ''}
          ${rsv ? `<div class="small" style="color:${blocked?'var(--bad)':'var(--ok)'}">${blocked ? 'Reservado esta jornada para ' + esc(member(rsv).team) : 'Reservado para ti esta jornada'}</div>` : ''}</div>
        <button class="sm" ${blocked || p.price > maxPrice ? 'disabled' : ''} onclick="mkPick(${p.id})">${M.out && M.armed===p.id ? 'Confirmar' : 'Fichar'}</button>
      </li>`}).join('') || '<li class="muted">Nadie con ese filtro</li>'}
    </ul>`}`}`;
  if(chooser || M.mode === 'rivales') return;
  $('#mq').oninput = e => { M.q = e.target.value; const pos = e.target.selectionStart; drawMarket(); const i=$('#mq'); i.focus(); i.setSelectionRange(pos,pos); };
  $('#mteam').onchange = e => { M.team = e.target.value; drawMarket(); };
  $('#msort').onchange = e => { M.sort = e.target.value; drawMarket(); };
  $('#mpos').onchange = e => { M.pos = e.target.value; drawMarket(); };
  $('#maf').onchange = e => { M.affordable = e.target.checked; drawMarket(); };
  $('#mrk').onchange = e => { M.rookies = e.target.checked; drawMarket(); };

function mkReset(){ const M = mkState(); M.out = null; M.inn = null; M.armed = null; drawMarket(); window.scrollTo(0,0); }
function mkPick(id){ const M = mkState();
  if(!M.out){ M.inn = id; M.armed = null; drawMarket(); return window.scrollTo(0,0); }
  if(M.armed !== id){ M.armed = id; drawMarket(); return toast(`Pulsa "Confirmar": entra ${S.byId[id].name}, sale ${S.byId[M.out]?.name}`); }
  mkDo(M.out, id); }
function mkConfirm(out, inn){ const M = mkState();
  if(M.armed !== out){ M.armed = out; drawMarket(); return toast(`Pulsa "Confirmar": entra ${S.byId[inn].name}, sale ${S.byId[out]?.name}`); }
  mkDo(out, inn); }
async function mkDo(out, inn){
  const { data, error } = await sb.rpc('request_swap', { p_league:S.league.id, p_out:out, p_in:inn });
  const M = mkState(); M.armed = null;
  if(error){ drawMarket(); return fail(error); }
  M.out = null; M.inn = null; S.td = null; S.lu = null;
  await loadTD();
  if(data === 'negotiating'){ toast('Otro equipo también lo quiere: se abre la negociación'); S.room = inn; render(); return window.scrollTo(0,0); }
  toast('Fichaje pendiente: ya puedes alinearlo'); render();
}
async function mkCancel(id){
  if(S.cancelArm !== id){ S.cancelArm = id; setTimeout(()=>S.cancelArm=null, 4000); return toast('Pulsa otra vez para retirar el fichaje'); }
  S.cancelArm = null;
  const { error } = await sb.rpc('cancel_swap', { p_request:id });
  if(error) return fail(error);
  S.td = null; S.lu = null; S.room = null; await loadTD(); toast('Fichaje retirado'); render();
}

// ---------- Sala de negociación ----------
function openRoom(pid){ S.room = pid; S.offer = null; S.tab = 'mercado'; render(); window.scrollTo(0,0); }
function closeRoom(){ S.room = null; S.offer = null; stopRoomPoll(); render(); }
function stopRoomPoll(){ if(S.roomPoll) clearInterval(S.roomPoll); S.roomPoll = null; }
function offerText(o, pid){
  const K = esc(member(o.keeper).team), loser = o.keeper === o.from_user ? o.to_user : o.from_user, O = esc(member(loser).team), P = pname(pid);
  if(o.comp_type === 'money') return `${K} se queda a ${P} y paga ${o.amount_m}M a ${O}.`;
  if(o.comp_type === 'preference') return `${K} se queda a ${P}. ${O} se retira y se lleva una preferencia sobre ${K} para la próxima vez que coincidan.`;
  if(o.comp_type === 'player') return `${K} se queda a ${P}. ${o.comp_player ? pname(o.comp_player) : 'El jugador que suelta'} queda reservado para ${O} la jornada siguiente.`;
  return `${K} se queda a ${P}. ${O} se retira sin nada a cambio.`;
}
async function drawRoom(keep){
  const T = S.td, pid = S.room, me = S.user.id, lid = S.league.id;
  const [mr, or] = await Promise.all([
    sb.from('transfer_messages').select('*').eq('league_id', lid).eq('week_no', T.week.week_no).eq('player_id', pid).order('created_at'),
    sb.from('transfer_offers').select('*').eq('league_id', lid).eq('week_no', T.week.week_no).eq('player_id', pid).order('created_at')
  ]);
  if(mr.error) return fail(mr.error);
  if(S.room !== pid || S.tab !== 'mercado') return;
  const msgs = mr.data || [], offers = or.data || [];
  const parts = T.live.filter(t => t.player_in === pid);
  const mine = parts.find(t => t.user_id === me);
  const other = parts.find(t => t.user_id !== me);
  const open = parts.length > 1;
  const accepted = offers.find(o => o.status === 'accepted');
  const openOffer = offers.find(o => o.status === 'open');
  const used = uid => offers.filter(o => o.from_user === uid).length;
  const left = 3 - used(me);
  const blocked = open && !openOffer && parts.every(t => used(t.user_id) >= 3);
  const state = accepted ? 'Acuerdo alcanzado' : !open ? 'Resuelta' : openOffer ? 'Nueva oferta' : blocked ? 'Negociación bloqueada' : 'En curso';
  const voucher = mine && other ? T.vouchers.find(v => v.holder === me && v.debtor === other.user_id && !v.used_at) : null;
  const draft = keep ? ($('#rmsg')?.value || '') : '';
  const F = S.offer;                                    // oferta que estoy montando
  const when = d => new Date(d).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const stO = { open:'Esperando respuesta', accepted:'Aceptada', rejected:'Rechazada', expired:'Caducada' };
  const items = [...msgs.map(m => ({ t:m.created_at, m })), ...offers.map(o => ({ t:o.created_at, o }))].sort((a,b) => a.t < b.t ? -1 : 1);
  const myKeepOut = mine ? pname(mine.player_out) : '', otKeepOut = other ? pname(other.player_out) : '';
  $('#tab').innerHTML = `
    <div style="position:sticky;top:46px;z-index:4;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)">
      <div class="between"><a href="#" onclick="closeRoom();return false" class="small">← Mercado</a><span class="pill ${accepted?'ok':openOffer?'accent':''}">${state}</span></div>
      <div class="name" style="font-size:18px;margin-top:4px">${pname(pid)} · ${S.byId[pid]?.price ?? 1}M</div>
      ${parts.map((t,i)=>`<div class="small" style="margin-top:2px"><b>${esc(member(t.user_id).team)}</b> <span class="muted">suelta a ${pname(t.player_out)}${open && i===0?' · lo pidió primero':''}${t.agreed?' · se lo queda':''}</span></div>`).join('') || '<div class="small muted">Ya no hay peticiones vivas por él.</div>'}
      ${open ? `<div class="small muted" style="margin-top:2px">Cierra ${fmtLock(T.week)}</div>` : ''}
    </div>
    <p class="small muted">${accepted ? 'Hay acuerdo: el fichaje se confirma al cierre de la jornada.' : open ? 'Sin acuerdo al cierre: jugador congelado, −3M a cada uno y reservado la jornada siguiente para quien lo pidió primero.' : 'La disputa ya no está abierta.'}</p>
    <div id="rlist">${items.map(it => it.m
      ? `<div class="card" style="margin:6px 0;padding:10px 12px;${it.m.user_id===me?'border-color:var(--line)':''}"><div class="small muted">${esc(member(it.m.user_id).team)} · ${when(it.t)}</div><div>${esc(it.m.body)}</div></div>`
      : `<div class="card" style="margin:6px 0;padding:10px 12px;border-color:var(--accent)">
          <div class="between"><span class="small" style="color:var(--accent)"><b>Oferta de ${esc(member(it.o.from_user).team)}</b> · ${when(it.t)}</span><span class="pill ${it.o.status==='accepted'?'ok':''}">${stO[it.o.status]}</span></div>
          <div style="margin-top:4px">${offerText(it.o, pid)}</div>
          ${it.o.status==='open' && it.o.to_user===me ? `<div class="row" style="margin-top:8px"><button class="sm" onclick="offerRespond('${it.o.id}',true)">${S.accArm===it.o.id?'Confirmar':'Aceptar'}</button><button class="sm ghost" onclick="offerRespond('${it.o.id}',false)">Rechazar</button><button class="sm ghost" onclick="offerCompose()" ${left>0?'':'disabled'}>Contraoferta</button></div>` : ''}
        </div>`).join('') || '<p class="muted small">Nadie ha dicho nada todavía.</p>'}</div>
    ${!mine && open ? '<p class="small muted">Estás mirando: solo negocian los implicados.</p>' : ''}
    ${mine && open ? `<div style="position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:8px">
      ${F ? `<div class="card" style="margin:0 0 8px;padding:12px">
          <div class="name">Tu oferta <span class="small muted">· te quedan ${left}</span></div>
          <label class="small muted">¿Quién se queda a ${pname(pid)}?</label>
          <select id="okeep"><option value="1" ${F.keep?'selected':''}>Yo (suelto a ${myKeepOut})</option><option value="0" ${F.keep?'':'selected'}>${esc(member(other.user_id).team)} (suelta a ${otKeepOut})</option></select>
          <label class="small muted">¿Qué recibe el que se retira?</label>
          <select id="ocomp">
            <option value="none" ${F.comp==='none'?'selected':''}>Nada</option>
            <option value="money1" ${F.comp==='money'&&F.amount===1?'selected':''}>1 millón</option>
            <option value="money2" ${F.comp==='money'&&F.amount===2?'selected':''}>2 millones</option>
            <option value="money3" ${F.comp==='money'&&F.amount===3?'selected':''}>3 millones</option>
            <option value="preference" ${F.comp==='preference'?'selected':''}>Una preferencia para la próxima colisión</option>
            <option value="player" ${F.comp==='player'?'selected':''}>Reserva de ${F.keep ? myKeepOut : otKeepOut} (el jugador que se suelta)</option>
          </select>
          <div class="row"><button class="sm" onclick="offerSend()">Enviar oferta</button><button class="sm ghost" onclick="S.offer=null;drawRoom(true)">Cancelar</button></div>
        </div>` : `
      <form id="rform" class="row"><input id="rmsg" maxlength="500" placeholder="Escribe un mensaje" value="${esc(draft)}" style="margin:0"><button class="sm" style="flex:0 0 auto">Enviar</button></form>
      <div class="row" style="margin-top:8px">
        <button class="sm" onclick="offerCompose()" ${left>0 && !(openOffer && openOffer.from_user===me) ? '' : 'disabled'}>${openOffer && openOffer.from_user===me ? 'Oferta enviada' : left>0 ? 'Hacer oferta (' + left + ')' : 'Sin ofertas'}</button>
        <button class="sm ghost" onclick="mkCancel('${mine.id}')">Me retiro</button>
      </div>
      ${voucher ? `<button class="sm ghost" style="width:100%;margin-top:8px;border-color:var(--accent)" onclick="useVoucher(${pid})">${S.vArm?'Confirmar: ':''}Usar mi preferencia: ${esc(member(other.user_id).team)} se retira</button>` : ''}`}
      </div>` : ''}`;
  const f = $('#rform'); if(f) f.onsubmit = async e => { e.preventDefault(); const v = $('#rmsg').value.trim(); if(!v) return;
    const { error } = await sb.rpc('post_transfer_message', { p_league:lid, p_player:pid, p_body:v });
    if(error) return fail(error); drawRoom(); };
  const ok = $('#okeep'); if(ok){ ok.onchange = e => { S.offer.keep = e.target.value === '1'; drawRoom(true); };
    $('#ocomp').onchange = e => { const v = e.target.value; if(v.startsWith('money')){ S.offer.comp = 'money'; S.offer.amount = +v.slice(5); } else { S.offer.comp = v; S.offer.amount = null; } }; }
  if(!keep) window.scrollTo(0, document.body.scrollHeight);
  if(!S.roomPoll) S.roomPoll = setInterval(async () => {
    if(document.hidden || S.tab !== 'mercado' || !S.room) return stopRoomPoll();
    const a = document.activeElement;
    if(S.offer || (a && a.id === 'rmsg' && a.value)) return;
    await loadTD(true); if(S.room) drawRoom(true);
  }, 6000);
}
function offerCompose(){ S.offer = { keep:true, comp:'none', amount:null }; drawRoom(true); }
async function offerSend(){ const F = S.offer, pid = S.room;
  const { error } = await sb.rpc('make_offer', { p_league:S.league.id, p_player:pid, p_i_keep:F.keep, p_comp:F.comp, p_amount:F.amount });
  if(error) return fail(error);
  S.offer = null; toast('Oferta enviada'); drawRoom(); }
async function offerRespond(id, accept){
  if(accept && S.accArm !== id){ S.accArm = id; setTimeout(()=>S.accArm=null, 4000); drawRoom(true); return toast('Pulsa "Confirmar" para cerrar el acuerdo'); }
  S.accArm = null;
  const { error } = await sb.rpc('respond_offer', { p_offer:id, p_accept:accept });
  if(error) return fail(error);
  S.td = null; S.lu = null; await loadTD(); toast(accept ? 'Acuerdo cerrado' : 'Oferta rechazada'); drawRoom(); }
async function useVoucher(pid){
  if(!S.vArm){ S.vArm = true; setTimeout(()=>S.vArm=false, 4000); drawRoom(true); return toast('Pulsa otra vez para gastar tu preferencia'); }
  S.vArm = false;
  const { error } = await sb.rpc('use_preference', { p_league:S.league.id, p_player:pid });
  if(error) return fail(error);
  S.td = null; S.lu = null; await loadTD(); toast('Preferencia usada: el jugador es tuyo'); drawRoom(); }

// ---------- Traspasos entre equipos (1 por 1, hasta 3M para equilibrar) ----------
const TR_ST = { open:'Esperando respuesta', accepted:'Acordado', rejected:'Rechazada', countered:'Contraofertada', cancelled:'Retirada', expired:'Caducada', executed:'Hecho' };
function tradeTerms(x){ const tm = u => esc(member(u).team);
  return `${tm(x.from_user)} da <b>${pname(x.give_player)}</b> y recibe <b>${pname(x.get_player)}</b>${x.amount_m ? ` · <b>${x.amount_m}M</b> que pone ${tm(x.payer)}` : ''}`; }
function tradesMine(){
  const T = S.td, me = S.user.id; if(!T.trades) return '';
  const last = {}; T.trades.forEach(x => last[x.thread] = x);
  const mine = Object.values(last).filter(x => (x.from_user === me || x.to_user === me) && ['open','accepted','rejected'].includes(x.status));
  if(!mine.length) return '';
  return `<h2>Mis traspasos</h2><ul class="list card" style="padding:0 14px">${mine.map(x => { const other = x.from_user === me ? x.to_user : x.from_user;
    const st = x.status === 'open' ? (x.to_user === me ? 'Te toca responder' : 'Esperando respuesta') : TR_ST[x.status];
    return `<li><div class="grow"><div class="name" style="white-space:normal">Con ${esc(member(other).team)}</div><div class="small muted">${tradeTerms(x)}</div></div>
      <span class="pill ${x.status==='accepted'?'ok':x.status==='open'&&x.to_user===me?'accent':''}">${st}</span><button class="sm ${x.status==='open'&&x.to_user===me?'':'ghost'}" onclick="openTrade('${x.thread}')">Ver</button></li>`; }).join('')}</ul>`;
}
function rivalsHTML(){
  const T = S.td, me = S.user.id;
  const busy = id => T.tradeLock.has(id);
  return `<p class="small muted" style="margin:10px 0 4px">Traspasos 1 por 1. Cada jugador viaja con su precio, y la diferencia se puede equilibrar con hasta 3M. Si hay acuerdo, el cambio entra en la jornada ${T.week.week_no}: la que está en juego sigue puntuando para su dueño actual.</p>
    ${S.members.filter(m => m.id !== me).map(m => { const ids = Object.keys(T.owner).map(Number).filter(id => T.owner[id] === m.id).sort((a,b) => (T.allPaid[b]||0) - (T.allPaid[a]||0));
      return `<h2 style="display:flex;align-items:center;gap:8px">${avatar(m.id, 26)} ${esc(m.team)}</h2><ul class="list card" style="padding:0 14px">${ids.map(id => { const p = S.byId[id] || {};
        return `<li><span class="price">${T.allPaid[id]}M</span><div class="grow"><div class="name">${pname(id)}${injIcon(id)}</div>
          <div class="small muted">${posBadge(p.pos,1)} ${p.team||''}${p.fp!=null?' · '+Number(p.fp).toFixed(1)+' FPPG':''}${p.rookie?' · <span class="pill ok">rookie</span>':''}</div>${injLine(id)}${formLine(id)}
          ${busy(id) ? '<div class="small" style="color:var(--accent)">Traspaso cerrado esta jornada</div>' : ''}</div>
          <button class="sm" ${busy(id)?'disabled':''} onclick="newTrade('${m.id}',${id})">Ofertar</button></li>`; }).join('')}</ul>`; }).join('')}`;
}
function openTrade(thread){ S.trade = { thread }; S.tf = null; S.room = null; S.tab = 'mercado'; S.view = null; render(); window.scrollTo(0,0); }
function newTrade(to, get){ S.trade = { thread:null, to }; S.tf = { give:null, get, money:0 }; S.tab = 'mercado'; render(); window.scrollTo(0,0); }
function closeTrade(){ S.trade = null; S.tf = null; stopRoomPoll(); render(); }
async function drawTrade(keep){

function arcMuted(){ try{ return !!localStorage.getItem('arcMute'); }catch(e){ return false; } }
function arcBeep(f, d, type){ if(arcMuted()) return; try{ const A = ARC.ac || (ARC.ac = new (window.AudioContext || window.webkitAudioContext)()); const o = A.createOscillator(), g = A.createGain();
  o.type = type || 'square'; o.frequency.value = f; g.gain.value = .06; o.connect(g); g.connect(A.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, A.currentTime + d); o.stop(A.currentTime + d); }catch(e){} }

  arcStop();

function arcNewShot(){ const g = ARC.g;
  g.speed = 0.75 + g.makes * 0.045;                       // vueltas por segundo de la barra
  g.zone = Math.max(0.055, 0.24 - g.makes * 0.0065);       // ancho de la zona verde
  g.target = 0.25 + Math.random() * 0.5;

function arcShoot(){ const g = ARC.g; if(g.ball) return;

  if(g.ball){ g.ball.t += dt / 0.75;

function arcDraw(){ const c = ARC.cx, g = ARC.g, W = 320, H = 220; if(!c) return;

  c.fillStyle = '#f28c28'; c.fillRect(px+2, py-4 - (up?4:0), 14, 18);                      // camiseta
  c.fillStyle = '#1a1206'; c.fillRect(px+6, py+2 - (up?4:0), 6, 6);                       // dorsal

  let bx = px + 10, by = py - 20;
  if(g.ball && g.ball.res !== 'clock'){ const t = Math.min(1, g.ball.t), r = g.ball.res;
    const tx = r === 'short' ? 238 : r === 'long' ? 290 : 282, ty = r === 'short' ? 140 : 82;
    bx = (px + 10) + (tx - px - 10) * t; by = (py - 20) + (ty - py + 20) * t - Math.sin(Math.PI * t) * 95;

  const sc = g.clock < 5 ? g.clock.toFixed(1) : String(Math.ceil(g.clock));
  c.fillStyle = '#1a0a0a'; c.fillRect(W/2 - 26, 4, 52, 26); c.strokeStyle = '#3a1414'; c.strokeRect(W/2 - 26.5, 3.5, 53, 27);
  c.font = 'bold 22px ui-monospace,Menlo,monospace'; c.textAlign = 'center'; c.fillStyle = '#3a1010'; c.fillText('88', W/2, 6);
  c.fillStyle = g.clock < 5 && Math.floor(g.clock * 4) % 2 ? '#ff8a7a' : '#ff3b2f'; c.fillText(sc, W/2, 6); c.textAlign = 'left';
  // barra de tiro
  const bxL = 60, bw = 200, byB = 196;
  c.fillStyle = '#20242d'; c.fillRect(bxL, byB, bw, 12);
  c.fillStyle = '#2fbf9b'; c.fillRect(bxL + (g.target - g.zone/2) * bw, byB, g.zone * bw, 12);

}

function txES(d){
  const strip = s => s.replace(/\b(?:PG|SG|SF|PF|Gs|Fs|Cs|G|F|C)\s+(?=[A-ZÀ-Ý])/g, '');
  return d.split(/\.\s+|\.$/).filter(Boolean).map(s => { s = strip(s.trim()); let m;
    if(m = s.match(/^Re-signed (.+?)(?: to .+)?$/)) return 'renueva a ' + m[1];
    if(m = s.match(/^Signed (.+?) to a two-way contract$/)) return 'ficha a ' + m[1] + ' (contrato dual)';
    if(m = s.match(/^Signed (.+?) to .*extension$/)) return 'renueva a ' + m[1];
    if(m = s.match(/^Signed (.+?)(?: to .+)?$/)) return 'ficha a ' + m[1];
    if(m = s.match(/^Waived (.+)$/)) return 'corta a ' + m[1];
    if(m = s.match(/^Claimed (.+?) off waivers$/)) return 'recoge a ' + m[1] + ' de los descartes';
    if(m = s.match(/^Converted (.+?) to a two-way contract$/)) return 'pasa a ' + m[1] + ' a contrato dual';
    if(m = s.match(/^Acquired (.+?) from (?:the )?(.+?) (?:in exchange )?for (.+)$/)) return 'adquiere a ' + m[1] + ' (llega de ' + m[2] + ' a cambio de ' + m[3] + ')';
    if(m = s.match(/^Traded (.+?) to (?:the )?(.+?) (?:in exchange )?for (.+)$/)) return 'traspasa a ' + m[1] + ' a ' + m[2] + ' a cambio de ' + m[3];
    return s; }).join('; ').replace(/ and /g, ' y ').replace(/cash considerations/g, 'dinero').replace(/\b(a|de) the /g, '$1 ');
}
function countdown(ms){ if(ms <= 0) return 'cerrada'; const s = Math.floor(ms/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), x = s%60;
  return (d ? d + 'd ' : '') + String(h).padStart(2,'0') + 'h ' + String(m).padStart(2,'0') + 'm ' + String(x).padStart(2,'0') + 's'; }

    <h2>Trash Talk</h2>

      ${deals.map(t => `<li><div class="grow"><div class="name" style="white-space:normal">Acuerdo: ${esc(member(t.user_id).team)} se queda a ${pname(t.player_in)}</div><div class="small muted">Se confirma al cierre de la jornada</div></div><button class="sm ghost" onclick="openRoom(${t.player_in})">Ver</button></li>`).join('')}
      ${tForMe.map(x => `<li><div class="grow"><div class="name" style="white-space:normal">🔁 ${esc(member(x.from_user).team)} te ofrece un traspaso</div><div class="small muted">${tradeTerms(x)}</div></div><button class="sm" onclick="openTrade('${x.thread}')">Ver</button></li>`).join('')}

    <div class="card" style="padding:4px 14px"><ul class="list">
      ${news.map(x => `<li><span class="pill">${esc(x.team||'NBA')}</span><div class="grow"><div style="font-size:14px">${esc(txES(x.description))}</div>
        <div class="small muted">${new Date(x.happened_at).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}${x.tags.length ? ' · ' + x.tags.map(t => `<b style="color:${t.tag==='tuyo'?'var(--accent)':'var(--text)'}">${pname(t.id)}: ${t.tag}</b>`).join(' · ') : ''}</div></div></li>`).join('') || '<li class="muted">Sin movimientos relevantes.</li>'}

  $('#wform').onsubmit = wallSend;
  const wEl = document.querySelector('.wall'); if(wEl) wEl.scrollTop = wallTop;
  stopTick();
  if(T.week) S.tick = setInterval(() => { const el = $('#cd'); if(!el || S.tab !== 'hoy') return stopTick(); el.textContent = countdown(new Date(T.week.locks_at) - Date.now()); }, 1000);
}

// ---------- Buscador de jugadores (sustituye a <datalist>, que falla en algunos móviles) ----------
const normTxt = t => (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function findPlayers(q, pool){ const n = normTxt(q.replace(/·.*$/, '')); if(!n) return [];
  const words = n.split(' ');
  return pool.filter(p => { const h = normTxt(p.name); return words.every(w => h.includes(w)); })
    .sort((a,b) => (normTxt(b.name).startsWith(n) - normTxt(a.name).startsWith(n)) || ((b.fp ?? -1) - (a.fp ?? -1))); }
// Devuelve el jugador o un mensaje de error claro
function resolvePlayer(v, pool){
  const exact = pool.find(p => (p.name + ' · ' + p.team) === v); if(exact) return exact;
  const m = findPlayers(v, pool);
  if(m.length === 1) return m[0];
  const full = m.filter(p => normTxt(p.name) === normTxt(v)); if(full.length === 1) return full[0];
  if(!m.length) return `No encuentro "${v}". Prueba con el apellido.`;
  return `"${v}" puede ser: ${m.slice(0,4).map(p => p.name + ' (' + p.team + ')').join(', ')}. Elige uno de la lista.`;
}
function attachTypeahead(input, pool){
  const box = document.createElement('div'); box.className = 'ta hidden'; input.after(box);
  const show = () => { const m = findPlayers(input.value, pool).slice(0, 6);
    if(!m.length || input.value === (m[0].name + ' · ' + m[0].team)){ box.classList.add('hidden'); return; }
    box.innerHTML = m.map(p => `<button type="button" data-v="${esc(p.name)} · ${p.team}">${posBadge(p.pos,1)} <b>${esc(p.name)}</b> <span class="muted">${p.team}${p.rookie?' · rookie':''}</span></button>`).join('');
    box.classList.remove('hidden'); };
  input.setAttribute('autocomplete', 'off');
  input.addEventListener('input', show); input.addEventListener('focus', show);
  input.addEventListener('blur', () => setTimeout(() => box.classList.add('hidden'), 150));
  box.addEventListener('pointerdown', e => { const b = e.target.closest('button'); if(!b) return; e.preventDefault(); input.value = b.dataset.v; box.classList.add('hidden'); });
}

// ---------- Predicciones ----------
async function renderPred(){
  $('#tab').innerHTML = '<p class="muted">Cargando…</p>';
  const [{ data, error }, , trib] = await Promise.all([sb.from('predictions').select('*').eq('league_id', S.league.id), S.league.draft_status === 'cerrado' ? arcLoad() : null, S.league.draft_status === 'cerrado' ? tribunalCard() : '']);
  if(error) return fail(error); if(S.tab !== 'pred' || S.view) return;
  const closeAt = S.league.predictions_close_at ? new Date(S.league.predictions_close_at) : null;
  const closed = closeAt && new Date() >= closeAt;
  const mine = Object.fromEntries(data.filter(d=>d.user_id===S.user.id).map(d=>[d.award,d]));
  const opts = (rookie) => S.players.filter(p=>!rookie||p.rookie).map(p=>`<option value="${esc(p.name)} · ${p.team}">`).join('');
  $('#tab').innerHTML = `
    ${S.league.draft_status === 'cerrado' ? `<h2>Tribunal</h2>${trib || ''}<h2>Arcade</h2>${arcadeCard()}<h2>Pedradas de temporada</h2>` : ''}
    <p class="muted small">${closed ? 'Pedradas cerradas.' : 'Se cierran el ' + (closeAt ? closeAt.toLocaleString('es-ES',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}) : '—') + '. Cada acierto: 3 puntos de liga. Podéis repetir jugador.'}</p>
    <form id="fp" class="card">
      ${AWARDS.map(([k,t])=>{
        const cur = mine[k];
        const val = k==='champion' ? (cur?.team||'') : (cur?.player_id ? (S.byId[cur.player_id]?.name+' · '+S.byId[cur.player_id]?.team) : '');
        return `<label class="small muted">${t}</label>` + (k==='champion'
          ? `<select name="${k}" ${closed?'disabled':''}><option value="">—</option>${TEAMS.map(x=>`<option ${val===x?'selected':''}>${x}</option>`).join('')}</select>`
          : `<input name="${k}" data-rk="${k==='roy'?1:''}" value="${esc(val)}" placeholder="Escribe el apellido" ${closed?'disabled':''}>`);
      }).join('')}
      ${closed?'':'<button style="width:100%">Guardar pedradas</button>'}
    </form>
    ${closed ? `<h2>Lo que eligió cada uno</h2>${S.members.map(m=>`<div class="card"><div class="name">${esc(m.team)}</div>${AWARDS.map(([k,t])=>{const d=data.find(x=>x.user_id===m.id&&x.award===k);return `<div class="small"><span class="muted">${t}:</span> ${d?(k==='champion'?d.team:esc(S.byId[d.player_id]?.name)):'—'}</div>`}).join('')}</div>`).join('')}` : ''}`;
  if(closed) return;
  document.querySelectorAll('#fp input[name]').forEach(i => attachTypeahead(i, i.dataset.rk ? S.players.filter(x=>x.rookie) : S.players));
  $('#fp').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target); const rows = [];
    for(const [k] of AWARDS){
      const v = (f.get(k)||'').trim(); if(!v) continue;
      if(k==='champion'){ rows.push({ league_id:S.league.id, user_id:S.user.id, award:k, team:v, player_id:null, updated_at:new Date().toISOString() }); continue; }
      const p = resolvePlayer(v, k==='roy' ? S.players.filter(x=>x.rookie) : S.players);
      if(typeof p === 'string') return fail(p);
      if(k==='roy' && !p.rookie) return fail(p.name+' no es rookie');
      rows.push({ league_id:S.league.id, user_id:S.user.id, award:k, player_id:p.id, team:null, updated_at:new Date().toISOString() });
    }
    if(!rows.length) return fail('Lanza al menos una pedrada');
    const { error } = await sb.from('predictions').upsert(rows, { onConflict:'league_id,user_id,award' });
    if(error) return fail(error); toast('Pedradas guardadas (' + rows.length + ' de 6)');
  };
}

  const pending = S.league.draft_status === 'pendiente';

    if(!S.lt) $('#tab').innerHTML = '<p class="muted" style="margin-top:14px">Cargando…</p>';
    await loadScores(); if(S.tab !== 'liga' || S.view) return;
    const opts = (S.sw || []).filter(w => new Date(w.locks_at) <= new Date());
    scores = `<h2>Clasificación</h2>${tableCard()}
      <h2 class="between">Jornada ${S.wsWeek || ''} ${opts.length > 1 ? `<select id="wsel" style="width:auto;margin:0">${opts.map(w=>`<option value="${w.week_no}" ${w.week_no===S.wsWeek?'selected':''}>Jornada ${w.week_no}</option>`).join('')}</select>` : ''}</h2>
      ${weekDetail()}`;
  }
  $('#tab').innerHTML = scores + `
    <h2>Participantes</h2>
    <ul class="list card" style="padding:0 14px">${S.members.map(m=>`<li><span class="pill">${m.pos??'–'}</span>${avatar(m.id, 30)}<div class="grow"><div class="name">${esc(m.team)}</div><div class="small muted">${esc(m.name)}${m.id===S.league.commissioner_id?' · comisionado':''}</div></div><span class="small muted">${myTeamInfo(m.id).spent}M</span></li>`).join('')}</ul>
    ${pending ? `<div class="card"><div class="small muted">Código para invitar</div><div class="between"><code>${esc(S.league.invite_code)}</code><button class="ghost sm" onclick="navigator.clipboard.writeText('${esc(S.league.invite_code)}');toast('Copiado')">Copiar</button></div></div>`:''}
    <div class="card" style="padding:4px 14px"><ul class="list"><li><button class="lnk grow" onclick="openView('reglas')">Reglas y puntuación</button><span>›</span></li>${isComm() ? `<li><button class="lnk grow" onclick="openView('comi')">Panel del comisionado</button><span>›</span></li>` : ''}</ul></div>
    ${S.league.draft_status === 'cerrado' ? `<details class="card"><summary class="name" style="cursor:pointer">Resultado del draft</summary>
      <ol class="small" style="padding-left:22px;margin:10px 0 0">${S.picks.map(p=>`<li value="${p.pick_no+1}"><b>${esc(S.byId[p.player_id]?.name || 'Jugador')}</b> (${p.price_m}M) → ${esc(member(p.user_id).team)}</li>`).join('')}</ol></details>` : ''}
    ${isComm() && pending ? `
      <h2>Panel del comisionado</h2>
      <div class="card">
        <p class="small muted">Orden del draft (1 = primero en elegir; va en serpiente). Sortéalo o, si la liga tiene historia, fíjalo a mano (p. ej. inverso a la clasificación de la temporada pasada).</p>
        ${S.members.map((m,i)=>`<label class="small muted">Pick ${i+1}</label><select name="o${i}" class="ord">${S.members.map(x=>`<option value="${x.id}" ${x.id===(S.members.find(y=>y.pos===i+1)?.id ?? S.members[i].id)?'selected':''}>${esc(x.team)} (${esc(x.name)})</option>`).join('')}</select>`).join('')}
        <div class="row"><button class="ghost" onclick="randomizeOrder()">Sortear</button><button class="ghost" onclick="saveOrder()">Guardar a mano</button><button onclick="startDraft()">Empezar draft</button></div>
      </div>` : ''}`;
  const ws = $('#wsel'); if(ws) ws.onchange = e => { S.weekView = +e.target.value; renderLiga(); };
}
function orderCard(){
  const set = S.members.every(m=>m.pos);
  const how = S.league.draft_order_method === 'sorteo' ? 'Sorteado' : 'Fijado a mano';
  const when = S.league.draft_order_set_at ? new Date(S.league.draft_order_set_at).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
  return `<h2>Orden del draft</h2>
    <div class="card">
      ${set ? `<ol style="margin:0;padding-left:22px">${S.members.map(m=>`<li style="padding:4px 0"><b>${esc(m.team)}</b> <span class="small muted">${esc(m.name)}</span></li>`).join('')}</ol>
        <p class="small muted">${how} por el comisionado${when?' · '+when:''}. Va en serpiente: 1-2-3, 3-2-1…</p>`
      : '<p class="muted">Todavía sin orden.</p>'}
      ${isComm() ? `<div class="row" style="margin-top:10px"><button class="ghost" onclick="randomizeOrder()">${set?'Volver a sortear':'Sortear orden'}</button><button onclick="startDraft()" ${set?'':'disabled'}>Empezar draft</button></div>
        <p class="small muted" style="margin-top:8px">Para fijarlo a mano: pestaña Liga › Panel del comisionado.</p>` : ''}
    </div>`;
}
async function randomizeOrder(){
  const { error } = await sb.rpc('randomize_draft_order', { p_league:S.league.id });
  if(error) return fail(error); await refreshLeague(); render(); toast('Orden sorteado');
}
async function saveOrder(){
  const order = [...document.querySelectorAll('.ord')].map(s=>s.value);
  if(new Set(order).size !== order.length) return fail('Cada participante debe aparecer una vez');
  const { error } = await sb.rpc('set_draft_order', { p_league:S.league.id, p_order:order });
  if(error) return fail(error); await refreshLeague(); render(); toast('Orden guardado');
}
async function startDraft(){
  if(!S.armStart){ S.armStart = true; toast('Pulsa otra vez "Empezar draft" para confirmar. Ya no se podrá unir nadie más.'); setTimeout(()=>S.armStart=false, 5000); return; }
  S.armStart = false;
  const { error } = await sb.rpc('start_draft', { p_league:S.league.id });
  if(error) return fail(error); await refreshLeague(); S.tab='draft'; render();
}

// ---------- utils & boot ----------
function localGet(k){ try{ return localStorage.getItem('fnba_'+k) }catch{ return null } }
function localSet(k,v){ try{ localStorage.setItem('fnba_'+k, v) }catch{} }

S.recovering = /type=recovery/.test(location.hash + location.search);
sb.auth.onAuthStateChange((ev, session) => {
  if((ev === 'PASSWORD_RECOVERY' || S.recovering) && session){
    S.user = session.user; S.booted = true;
    if(!S.newPassShown){ S.newPassShown = true; setTimeout(viewNewPass, 0); }
    return;
  }
  const u = session?.user || null;
  if(u?.id === S.user?.id && S.booted) return;
  S.booted = true;
  S.user = u; S.league = null;
  if(u) setTimeout(loadHome, 0); else { stopPoll(); viewAuth(); }
});
